# $schema: ../schemas/learning-control.schema.json
# Template for Deep Reinforcement Learning & Learning-Based Control experiments.

experiment:
  id: "EXP010"
  name: "SAC-Lagrangian Quadruped Locomotion with Domain Randomization"

algorithm:
  name: "SAC-Lagrangian"
  type: "model_free_rl"
  hyperparameters:
    discount_gamma: 0.99
    learning_rate: 3.0e-4
    batch_size: 512
    target_entropy: -12.0
    cost_limit: 0.05

environment:
  name: "Unitree-Go2-Locomotion"
  simulator: "isaac_lab"
  state_dim: 48
  action_dim: 12

seeds:
  evaluation_seeds: [42, 43, 44, 45, 46, 101, 102, 103, 104, 105]

domain_randomization:
  enabled: true
  parameters:
    base_mass_kg: [12.0, 18.0]
    ground_friction: [0.3, 1.2]
    motor_damping_ratio: [0.8, 1.2]
    latency_ms: [0, 20]

metrics:
  - "iqm_score"
  - "ci_95_bounds"
  - "cumulative_episodic_reward"
  - "constraint_violations"
  - "sim_to_real_drop_pct"
